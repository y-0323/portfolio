<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta広告向けLPサンプル</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="hero">
      <p class="tag">Meta広告向けサンプルLP</p>
      <h1>最短30分で始める
        オンライン学習プログラム</h1>
      <p class="lead">まずは無料カウンセリングで、あなたに合う学習プランを診断します。</p>
      <a class="cta" href="#form">無料で相談する</a>
    </header>

    <main>
      <section class="section">
        <h2>こんな悩みはありませんか？</h2>
        <ul>
          <li>何から学べば良いかわからない</li>
          <li>独学が続かず途中で挫折してしまう</li>
          <li>仕事と両立できるか不安</li>
        </ul>
      </section>

      <section class="section">
        <h2>選ばれる3つの理由</h2>
        <ol>
          <li>専属メンターが週1で進捗サポート</li>
          <li>短時間で学べる動画カリキュラム</li>
          <li>目的別に選べる3つの学習コース</li>
        </ol>
      </section>

      <section id="form" class="section form">
        <h2>無料カウンセリング予約</h2>
        <form>
          <label>お名前<input type="text" name="name" placeholder="山田 太郎" /></label>
          <label>メールアドレス<input type="email" name="email" placeholder="example@example.com" /></label>
          <button type="submit">送信する</button>
        </form>
      </section>
    </main>
  </body>
</html>
